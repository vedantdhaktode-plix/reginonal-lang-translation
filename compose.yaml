services:
  app:
    build: .
    image: directory-language-studio
    ports:
      - "${HOST_PORT:-8001}:8000"
    environment:
      PORT: "8000"
      PIPELINE_DATA_DIR: /data
      PIPELINE_MAX_UPLOAD_BYTES: ${PIPELINE_MAX_UPLOAD_BYTES:-2147483648}
      PIPELINE_SOURCE_LANGUAGE: ${PIPELINE_SOURCE_LANGUAGE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gemini-3.5-flash-lite}
      TRANSLATION_BATCH_SIZE: ${TRANSLATION_BATCH_SIZE:-12}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-gemini}
      OCR_PROVIDER: ${OCR_PROVIDER:-gemini}
      OCR_TARGET_BOX: ${OCR_TARGET_BOX:-agent}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.5-flash-lite}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-gemini}
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      SCRIPT_REVIEW_MODEL: ${SCRIPT_REVIEW_MODEL:-openai/gpt-oss-120b}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      TARGET_TTS_VOICE_ID: ${TARGET_TTS_VOICE_ID:-}
      HI_TTS_VOICE_ID: ${HI_TTS_VOICE_ID:-}
      MR_TTS_VOICE_ID: ${MR_TTS_VOICE_ID:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      SYNC_MODEL: ${SYNC_MODEL:-lipsync-2}
      LIPSYNC_CLASSIFY_WINDOW_SEC: ${LIPSYNC_CLASSIFY_WINDOW_SEC:-0.5}
      LIPSYNC_MAX_HEAD_YAW_DEG: ${LIPSYNC_MAX_HEAD_YAW_DEG:-16}
      LIPSYNC_MAX_HEAD_PITCH_DEG: ${LIPSYNC_MAX_HEAD_PITCH_DEG:-20}
      LIPSYNC_MAX_HEAD_PITCH_DELTA_DEG: ${LIPSYNC_MAX_HEAD_PITCH_DELTA_DEG:-15}
      LIPSYNC_MAX_AWAY_FACE_RATIO: ${LIPSYNC_MAX_AWAY_FACE_RATIO:-0.4}
      OVERLAY_PATCH_COLOR: ${OVERLAY_PATCH_COLOR:-0x000000}
      BOX_TEXT_COLOR: ${BOX_TEXT_COLOR:-#FFFFFF}
    volumes:
      - directory-language-data:/data
      - .:/app/dir_language_pipeline

volumes:
  directory-language-data:
